name: Daily TB report update

on:
  schedule:
    # Every 3 hours UTC (08/11/14/17/20/23/02/05 Asia/Taipei) — 冗餘以防 GitHub 跳過某次排程
    - cron: "0 */3 * * *"
  workflow_dispatch: {}  # 也可手動從 Actions 頁面觸發

permissions:
  contents: write  # commit/push docs/index.html back to main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml curl_cffi

      - name: Fetch guild rosters
        run: python fetch_guild.py --force
        env:
          PYTHONIOENCODING: utf-8

      - name: Generate HTML report
        run: python generate_html.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Generate Line message
        run: python line_message.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Commit & push if outputs changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/line_message.txt
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto: daily TB report refresh ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
